plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.majan.app"
    compileSdk = 35
    ndkVersion "26.1.10909125" // ✅ Supports 16KB memory pages


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true  
    }

    kotlinOptions {
        jvmTarget = '17'
    }
   
    defaultConfig {
        applicationId = "com.majan.app"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        
        // ✅ ADDED: Critical for multi-ABI support with many dependencies
        multiDexEnabled true
        
        // ✅ Support all Android device architectures (32-bit + 64-bit)
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a','x86_64'
        }
    }
    

     packagingOptions {
        jniLibs {
            useLegacyPackaging false  // ✅ Required for uncompressed .so (16 KB alignment)
        }
    }

    // ✅ Generate optimized APKs for each architecture
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a','x86_64'
            universalApk true  // Also generate a universal APK
        }
    }

    // ✅ Bundle configuration for 16KB page size support
    bundle {
        density {
            enableSplit false
        }
        abi {
            enableSplit true
        }
        language {
            enableSplit false
        }
    }
    
    

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth:22.3.1'
    
    // ✅ REMOVED: Duplicate SafetyNet entries (deprecated API)
    // Old: implementation 'com.google.android.gms:play-services-safetynet:18.0.1'
    
    // ✅ NEW: Replace SafetyNet with Play Integrity API
    implementation 'com.google.android.play:integrity:1.3.0'
    
    implementation 'androidx.browser:browser:1.7.0'
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'androidx.annotation:annotation:1.7.0'
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    implementation 'com.google.android.gms:play-services-base:18.3.0'
    implementation 'com.google.android.gms:play-services-gcm:17.0.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.firebase:firebase-common:20.4.2'

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    
    // ✅ ADDED: Required for multiDexEnabled true
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.ar:core:1.43.0'
}

flutter {
    source = "../.."
}